[project]
name = "device-health-gui"
version = "0.1.0"
description = "Lightweight PyQt6 device health dashboard for Linux with an optional AI summary"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqt6>=6.11.0",
]

[project.scripts]
device-health-gui = "device_health_gui:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
