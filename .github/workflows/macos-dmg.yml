# Builds the universal macOS .dmg on a GitHub-hosted Mac.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# The .dmg is attached to the run as an artifact.
name: macOS dmg

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: device-health-dashboard-macos
          path: dist/*.dmg
