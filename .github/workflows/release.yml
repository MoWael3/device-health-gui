# Builds the app for macOS (.dmg), Windows (.zip) and Linux (.deb, .tar.gz).
#
# - "Run workflow" on the Actions tab: builds everything; files are attached
#   to the run as artifacts (kept 90 days).
# - Pushing a tag like v0.1.2: also publishes a GitHub Release with the files
#   and their SHA-256 checksums (kept permanently).
#
# Signing switches on automatically when these repository secrets exist
# (Settings → Secrets and variables → Actions); otherwise builds are unsigned.
#   macOS:   MACOS_CERT_P12 (base64 of a Developer ID Application .p12),
#            MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (for notarization)
#   Windows: WINDOWS_CERT_PFX (base64 of a code-signing .pfx), WINDOWS_CERT_PASSWORD
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build .dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: device-health-dashboard-macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Decode signing certificate
        if: env.WINDOWS_CERT_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          "WINDOWS_CERT_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build .zip
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: device-health-dashboard-windows
          path: dist/*.zip

  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb and .tar.gz
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: device-health-dashboard-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
